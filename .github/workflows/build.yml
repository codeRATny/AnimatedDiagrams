name: Build installers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Собираем docker-образ с библиотеками для сборки
      - name: Build builder image
        run: docker build -t ad-builder -f Dockerfile .

      # 2) Этим образом собираем deb, rpm и exe
      - name: Build deb, rpm, exe
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/project \
            -w /project \
            ad-builder \
            bash -lc "npm ci && npx electron-builder --linux deb rpm --win nsis --publish never"

      - name: List built installers
        run: ls -la release || true

      # 3) Сохраняем установщики в артефакты
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            release/*.deb
          if-no-files-found: error
          retention-days: 14
