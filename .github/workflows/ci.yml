name: CI

# Build + tests on every target platform; packages go to artifacts.
# A vX.Y.Z tag publishes a GitHub Release with deb / rpm / exe / zip and SHA256SUMS.
# PRs from this repository are not rebuilt (already built by the branch push).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  EMSDK_VERSION: '6.0.10' # HTML player toolchain (keep in sync with docs/presentations.md)

jobs:
  # HTML player: ad_engine compiled to WebAssembly + a canvas renderer, one self-contained
  # player.html that the linux / windows builds embed (-DAD_PLAYER_HTML) for the HTML export.
  player:
    name: HTML player (Emscripten)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Version from tag
        shell: bash
        run: ci/version-from-tag.sh >> "$GITHUB_ENV"

      - name: Configure
        run: emcmake cmake -S . -B build-player -G Ninja -DWARNINGS_AS_ERRORS=ON ${AD_VERSION_ARG:-}

      - name: Build
        run: cmake --build build-player && ls -l build-player/player/player.html

      - uses: actions/upload-artifact@v5
        with:
          name: player-html
          path: build-player/player/player.html
          if-no-files-found: error
          retention-days: 14

  linux:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: player
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 (deb)
            image: ubuntu:24.04
            family: debian
            cc: clang-19
            cxx: clang++-19
            packages: clang-19
            generator: DEB
            suffix: ubuntu24.04
          - name: Ubuntu 24.04 (gcc-13)
            image: ubuntu:24.04
            family: debian
            cc: gcc-13
            cxx: g++-13
            packages: g++-13
            generator: ''
            suffix: ''
          - name: Debian 13 (deb)
            image: debian:13
            family: debian
            cc: clang-19
            cxx: clang++-19
            packages: clang-19
            generator: DEB
            suffix: debian13
          - name: Fedora 43 (rpm)
            image: fedora:43
            family: fedora
            cc: clang
            cxx: clang++
            packages: clang
            generator: RPM
            suffix: ''
    steps:
      - name: Install dependencies (apt)
        if: matrix.family == 'debian'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config ${{ matrix.packages }} \
            qt6-base-dev qt6-qpa-plugins libgl-dev qt6-tools-dev qt6-l10n-tools \
            libgtest-dev nlohmann-json3-dev \
            libavcodec-dev libavformat-dev libswscale-dev \
            libzip-dev libpugixml-dev \
            dpkg-dev file fonts-dejavu-core

      - name: Install dependencies (dnf)
        if: matrix.family == 'fedora'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build pkgconf-pkg-config ${{ matrix.packages }} \
            qt6-qtbase-devel mesa-libGL-devel qt6-qttools-devel qt6-linguist \
            gtest-devel json-devel \
            libavcodec-free-devel libavformat-free-devel libavutil-free-devel libswscale-free-devel \
            libzip-devel pugixml-devel \
            rpm-build dejavu-sans-fonts dejavu-sans-mono-fonts

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: player-html
          path: player-dist

      - name: Version from tag
        shell: bash
        run: ci/version-from-tag.sh >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DBUILD_TESTS=ON
          -DWARNINGS_AS_ERRORS=ON
          -DREQUIRE_TRANSLATIONS=ON
          -DAD_PLAYER_HTML=$PWD/player-dist/player.html
          -DAD_PACKAGE_RELEASE_SUFFIX=${{ matrix.suffix }}
          ${AD_VERSION_ARG:-}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Package
        if: matrix.generator != ''
        run: cd build && cpack -G ${{ matrix.generator }} -B ../dist

      - uses: actions/upload-artifact@v5
        if: matrix.generator != ''
        with:
          name: package-${{ matrix.generator }}-${{ matrix.suffix || 'fedora' }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: Core tests (ASan + UBSan)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config clang-19 libclang-rt-19-dev libgtest-dev nlohmann-json3-dev \
            libavcodec-dev libavformat-dev libswscale-dev libzip-dev libpugixml-dev
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DBUILD_APP=OFF
          -DBUILD_TESTS=ON
          -DWARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  lint:
    name: clang-format + clang-tidy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config clang-19 clang-format-19 clang-tidy-19 \
            qt6-base-dev libgl-dev libgtest-dev nlohmann-json3-dev \
            libavcodec-dev libavformat-dev libswscale-dev libzip-dev libpugixml-dev
      - uses: actions/checkout@v5
      - name: clang-format
        run: |
          git ls-files 'src/*.cpp' 'src/*.hpp' 'UI/*.cpp' 'UI/*.hpp' 'apps/*.cpp' 'tests/*.cpp' 'player/*.cpp' \
            | xargs clang-format-19 --dry-run -Werror
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DBUILD_TESTS=ON
      - name: Generate Qt sources
        run: cmake --build build --target ad_ui_autogen
      - name: clang-tidy
        run: run-clang-tidy-19 -p build -quiet -j 4 "^${GITHUB_WORKSPACE}/(src|UI|apps)/"

  windows:
    name: Windows (MSVC, NSIS + ZIP)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: player
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: player-html
          path: player-dist

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Install FFmpeg libraries (LGPL, shared)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest release-branch build (n7.1, n8.0, ...) of BtbN/FFmpeg-Builds: include/, lib/ (import libs), bin/ (DLLs)
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest \
                | grep -o '"browser_download_url": *"[^"]*-win64-lgpl-shared-[0-9.]*\.zip"' \
                | sed 's/.*"\(https[^"]*\)"/\1/' | sort -V | tail -1)
          echo "FFmpeg SDK: $url"
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$url"
          7z x -y "$RUNNER_TEMP/ffmpeg.zip" -o"$RUNNER_TEMP" > /dev/null
          root="$RUNNER_TEMP/$(basename "$url" .zip)"
          echo "FFMPEG_ROOT=$(cygpath -m "$root")" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: vcpkg binary cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -w "$RUNNER_TEMP/vcpkg-cache"),readwrite" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Ensure NSIS
        shell: bash
        run: command -v makensis || choco install nsis -y --no-progress

      - name: Version from tag
        shell: bash
        run: ci/version-from-tag.sh >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_TESTS=ON
          -DREQUIRE_TRANSLATIONS=ON
          -DAD_PLAYER_HTML="$(cygpath -m "$PWD")/player-dist/player.html"
          ${AD_VERSION_ARG:-}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          cd build && cpack -G "NSIS;ZIP" -C ${{ env.BUILD_TYPE }} -B ../dist

      - uses: actions/upload-artifact@v5
        with:
          name: package-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [player, linux, sanitizers, lint, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
